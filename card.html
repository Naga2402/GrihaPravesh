<!doctype html>
<html lang="te">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f0a04">
  <title>Griha Pravesam · గృహప్రవేశం</title>
  <meta property="og:title" content="Griha Pravesam Invitation · గృహప్రవేశ ఆహ్వానం">
  <meta property="og:description" content="Tap to see your invitation poster.">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='30' fill='%23b98631'/><text x='32' y='45' font-size='36' text-anchor='middle' fill='%236e1f10'>ॐ</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Pinyon+Script&family=Ramaraja&family=Suravaram&family=Tiro+Devanagari+Sanskrit&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/card.css">
</head>
<body>
  <main class="stage">
    <div class="poster" id="poster">
      <!-- An <img>, not a canvas, so a long-press still offers "Scan QR code" / Google Lens. -->
      <img id="posterImg" alt="Your Griha Pravesam invitation poster">
      <div class="busy" id="busy">ॐ</div>
      <a class="qr-hot" id="qrHot" href="#" hidden aria-haspopup="dialog">
        <span class="ring"></span><span class="ring r2"></span>
        <span class="hand" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="#fffdf8" stroke="#6e1f10" stroke-width="1.4" stroke-linejoin="round"><path d="M9 11V4.5a1.5 1.5 0 0 1 3 0V10l.2-1.3a1.5 1.5 0 0 1 3 .3v1.6l.3-.9a1.5 1.5 0 0 1 2.9.8V15a7 7 0 0 1-7 7h-.6a6 6 0 0 1-4.6-2.2L4 16.7a1.6 1.6 0 0 1 2.3-2.2L9 16.5z"/></svg>
        </span>
        <span class="sr-only" id="qrLabel"></span>
      </a>
      <div class="bubble" id="bubble" hidden></div>
    </div>
  </main>

  <div class="sheet-bg" id="sheetBg" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
    <p class="sheet-title" id="sheetTitle"></p>
    <a class="link" id="sheetLink"></a>
    <a class="btn primary" id="openBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3h7v7M10 14 21 3M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/></svg>
      <span id="openLabel"></span>
    </a>
    <button class="btn" id="copyBtn" type="button">Copy link</button>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <script src="config.js"></script>
  <script src="assets/js/core.js"></script>
  <script src="assets/js/art.js"></script>
  <script src="assets/js/poster.js"></script>
  <script src="assets/js/card.js"></script>
</body>
</html>
